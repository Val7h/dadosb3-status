name: Monitor externo do Dados B3

# Roda nos servidores do GitHub, fora do Render. Falhou = o job fica vermelho e o GitHub avisa por e-mail.
on:
  schedule:
    - cron: "*/5 * * * *"      # a cada 5 minutos (o GitHub pode atrasar alguns minutos em hora de pico)
  workflow_dispatch: {}         # botão "Run workflow" para testar na hora

permissions:
  contents: write               # só para gravar status/historico.csv e docs/index.html

concurrency:
  group: monitor-dados-b3
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIMITE_DIAS_SEM_PREGAO: "6"     # /saude: dias desde o último pregão aceitos (fim de semana e feriado cabem)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cada endereço: tempo limite de 20 s, 2 tentativas. Falhou: acrescenta linha em status/historico.csv.
      - name: Verificar o site
        id: verificar
        continue-on-error: true
        run: python verificar.py --base https://dadosb3.com --historico status/historico.csv --limite-dias "$LIMITE_DIAS_SEM_PREGAO"

      - name: Gerar a página de status
        run: python gerar_pagina.py --historico status/historico.csv --saida docs/index.html

      - name: Guardar o histórico e a página
        run: |
          git config user.name "monitor-dados-b3"
          git config user.email "monitor-dados-b3@users.noreply.github.com"
          git add status/historico.csv docs/index.html
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "status: atualização automática"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Só aqui o job fica vermelho (depois de guardar o histórico). É isto que faz o GitHub mandar o e-mail.
      - name: Falhar se o site falhou
        if: steps.verificar.outcome == 'failure'
        run: |
          echo "O site falhou em pelo menos uma verificação. Veja o passo 'Verificar o site'."
          exit 1
